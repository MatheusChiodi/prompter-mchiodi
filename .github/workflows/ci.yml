name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Backend smoke test
        run: |
          node server/src/index.js &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:5179/api/health && break; sleep 0.5; done
          curl -fsS http://127.0.0.1:5179/api/files | grep -q exemplo.md
