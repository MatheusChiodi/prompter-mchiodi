<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompter MChiodi · Fluxo de dados</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-accent: #bf4520;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1040px; display: block; }
    svg .name { font-family: var(--font-sans); font-weight: 600; font-size: 14px; fill: #2d3142; }
    svg .sub { font-family: var(--font-mono); font-size: 10.5px; fill: #4f5d75; }
    svg .tag { font-family: var(--font-mono); font-size: 8.5px; letter-spacing: 0.08em; fill: #4f5d75; }
    svg .lbl { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.06em; fill: #4f5d75; }
    svg .zone { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.16em; fill: #4f5d75; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Arquitetura · Fluxo de dados</p>
    <h1>Prompter MChiodi: voz em tempo real local, Claude Code assíncrono</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1040 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fluxo-title fluxo-desc">
        <title id="fluxo-title">Prompter MChiodi: fluxo de dados</title>
        <desc id="fluxo-desc">A fala em pt-BR alimenta um matcher local que move o cursor do roteiro, enquanto o backend Node chama o Claude Code CLI de forma assíncrona para pré-processamento, reancoragem e revisão.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- zonas -->
        <rect x="24" y="64" width="544" height="496" rx="8" fill="none" stroke="rgba(45,49,66,0.25)" stroke-dasharray="4,4"/>
        <text class="zone" x="40" y="88">NAVEGADOR · REACT + VITE</text>
        <rect x="608" y="64" width="408" height="496" rx="8" fill="none" stroke="rgba(45,49,66,0.25)" stroke-dasharray="4,4"/>
        <text class="zone" x="624" y="88">MÁQUINA LOCAL · NODE</text>

        <!-- conexões (antes dos nós) -->
        <line x1="248" y1="144" x2="334" y2="144" stroke="#4f5d75" stroke-width="1.25" marker-end="url(#arrow)"/>
        <rect x="264" y="120" width="56" height="14" fill="#f5f5f5"/>
        <text class="lbl" x="292" y="130" text-anchor="middle">MARKDOWN</text>

        <line x1="436" y1="176" x2="436" y2="270" stroke="#4f5d75" stroke-width="1.25" marker-end="url(#arrow)"/>
        <rect x="446" y="216" width="56" height="14" fill="#f5f5f5"/>
        <text class="lbl" x="474" y="226" text-anchor="middle">PALAVRAS</text>

        <line x1="248" y1="304" x2="334" y2="304" stroke="#4f5d75" stroke-width="1.25" marker-end="url(#arrow)"/>
        <rect x="276" y="280" width="32" height="14" fill="#f5f5f5"/>
        <text class="lbl" x="292" y="290" text-anchor="middle">FALA</text>

        <line x1="469" y1="336" x2="469" y2="430" stroke="#bf4520" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
        <rect x="479" y="376" width="48" height="14" fill="#f5f5f5"/>
        <text class="lbl" x="503" y="386" text-anchor="middle" style="fill:#bf4520">CURSOR</text>

        <path d="M403 336 V392 Q403 400 395 400 H156 Q148 400 148 408 V430" fill="none" stroke="#4f5d75" stroke-width="1.25" marker-end="url(#arrow)"/>
        <rect x="260" y="376" width="32" height="14" fill="#f5f5f5"/>
        <text class="lbl" x="276" y="386" text-anchor="middle">HITS</text>

        <path d="M538 160 H580 Q588 160 588 168 V200 Q588 208 596 208 H739 Q747 208 747 216 V270" fill="none" stroke="#2e5aa8" stroke-width="1.25" stroke-dasharray="5,4" marker-start="url(#arrow-link)" marker-end="url(#arrow-link)"/>
        <rect x="634" y="184" width="68" height="14" fill="#f5f5f5"/>
        <text class="lbl" x="668" y="194" text-anchor="middle">PREPROCESS</text>

        <line x1="538" y1="304" x2="678" y2="304" stroke="#2e5aa8" stroke-width="1.25" stroke-dasharray="5,4" marker-start="url(#arrow-link)" marker-end="url(#arrow-link)"/>
        <rect x="578" y="280" width="58" height="14" fill="#f5f5f5"/>
        <text class="lbl" x="607" y="290" text-anchor="middle">REANCORA</text>

        <line x1="813" y1="270" x2="813" y2="178" stroke="#2e5aa8" stroke-width="1.25" marker-start="url(#arrow-link)" marker-end="url(#arrow-link)"/>
        <rect x="823" y="217" width="76" height="14" fill="#f5f5f5"/>
        <text class="lbl" x="861" y="227" text-anchor="middle">STDIN · JSON</text>

        <line x1="780" y1="336" x2="780" y2="430" stroke="#4f5d75" stroke-width="1.25" marker-end="url(#arrow)"/>
        <rect x="790" y="376" width="46" height="14" fill="#f5f5f5"/>
        <text class="lbl" x="813" y="386" text-anchor="middle">SHA256</text>

        <path d="M148 496 V536 Q148 544 156 544 H912 Q920 544 920 536 V312 Q920 304 912 304 H882" fill="none" stroke="#2e5aa8" stroke-width="1.25" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
        <rect x="540" y="520" width="44" height="14" fill="#f5f5f5"/>
        <text class="lbl" x="562" y="530" text-anchor="middle">REVIEW</text>

        <!-- nós -->
        <g>
          <rect x="48" y="112" width="200" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="48" y="112" width="200" height="64" rx="6" fill="rgba(46,90,168,0.05)" stroke="#2d3142" stroke-width="1"/>
          <text class="tag" x="60" y="128">ENTRADA</text>
          <text class="name" x="60" y="148">Roteiro .md</text>
          <text class="sub" x="60" y="164">drop · pasta monitorada</text>
        </g>
        <g>
          <rect x="336" y="112" width="200" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="336" y="112" width="200" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
          <text class="tag" x="348" y="128">PARSER</text>
          <text class="name" x="348" y="148">Parser local</text>
          <text class="sub" x="348" y="164">cues · seções · aliases</text>
        </g>
        <g>
          <rect x="48" y="272" width="200" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="48" y="272" width="200" height="64" rx="6" fill="rgba(46,90,168,0.05)" stroke="#2d3142" stroke-width="1"/>
          <text class="tag" x="60" y="288">ENTRADA</text>
          <text class="name" x="60" y="308">Mic + Web Speech</text>
          <text class="sub" x="60" y="324">pt-BR · interim/final</text>
        </g>
        <g>
          <rect x="336" y="272" width="200" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="336" y="272" width="200" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.5"/>
          <text class="tag" x="348" y="288" style="fill:#bf4520">TEMPO REAL</text>
          <text class="name" x="348" y="308">Matcher local</text>
          <text class="sub" x="348" y="324">lookahead 20 · bigrama</text>
        </g>
        <g>
          <rect x="48" y="432" width="200" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="48" y="432" width="200" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#2d3142" stroke-width="1"/>
          <text class="tag" x="60" y="448">ESTADO</text>
          <text class="name" x="60" y="468">SessionLog</text>
          <text class="sub" x="60" y="484">hits · improviso</text>
        </g>
        <g>
          <rect x="336" y="432" width="200" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="336" y="432" width="200" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
          <text class="tag" x="348" y="448">UI</text>
          <text class="name" x="348" y="468">Prompter</text>
          <text class="sub" x="348" y="484">destaque · scroll rAF</text>
        </g>
        <g>
          <rect x="680" y="112" width="200" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="680" y="112" width="200" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3"/>
          <text class="tag" x="692" y="128">CLI EXTERNO</text>
          <text class="name" x="692" y="148">claude -p</text>
          <text class="sub" x="692" y="164">login assinatura · json</text>
        </g>
        <g>
          <rect x="680" y="272" width="200" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="680" y="272" width="200" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
          <text class="tag" x="692" y="288">API</text>
          <text class="name" x="692" y="308">Backend Node</text>
          <text class="sub" x="692" y="324">127.0.0.1:5179</text>
        </g>
        <g>
          <rect x="680" y="432" width="200" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="680" y="432" width="200" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#2d3142" stroke-width="1"/>
          <text class="tag" x="692" y="448">ESTADO</text>
          <text class="name" x="692" y="468">Cache</text>
          <text class="sub" x="692" y="484">.cache/preprocess</text>
        </g>

        <!-- legenda -->
        <line x1="24" y1="584" x2="1016" y2="584" stroke="rgba(45,49,66,0.15)"/>
        <rect x="24" y="604" width="16" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.5"/>
        <text class="lbl" x="48" y="614">LOOP DE TEMPO REAL (SEM REDE PARA O CLAUDE)</text>
        <line x1="380" y1="610" x2="412" y2="610" stroke="#2e5aa8" stroke-width="1.25" stroke-dasharray="5,4"/>
        <text class="lbl" x="420" y="614">HTTP ASSÍNCRONO · OPCIONAL</text>
        <rect x="620" y="604" width="16" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#2d3142"/>
        <text class="lbl" x="644" y="614">ESTADO / ARMAZENAMENTO</text>
        <rect x="820" y="604" width="16" height="12" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-dasharray="4,3"/>
        <text class="lbl" x="844" y="614">PROCESSO EXTERNO</text>
      </svg>
    </div>
  </div>
</body>
</html>
